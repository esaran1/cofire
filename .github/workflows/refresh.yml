name: weekly refresh

# Fridays, a day after the Thursday 08:30 ET USDM release. Fetches the new
# drought map and ERC days through the ledger and safe_fetch, runs the frozen
# path, and commits the export. Scores nothing; the look counter must read 3
# before and after (asserted inside the refresh).
on:
  schedule:
    - cron: "30 18 * * 5"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Fail on purpose, to test the failure alert"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      COFIRE_DEV_SUBSET: "1"
      # CI transfers go to their own ledger, not the local project ledger.
      # Each run is one session, capped at 3x the measured steady-state run
      # (cofire/ship/ci_budget.py): safe_fetch refuses a transfer that would
      # cross it, and the check step fails the job if the total does.
      COFIRE_LEDGER_PATH: artifacts/ci/ledger.json
      COFIRE_FETCH_SESSION: refresh-${{ github.run_id }}
      COFIRE_FETCH_SESSION_CAP: "10778277"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Forced failure (alert test)
        if: ${{ inputs.force_fail }}
        run: |
          echo "force_fail was set: failing on purpose to test the alert"
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - name: Restore the data pack
        # 14 MB: USDM clipped to Colorado (gated identical to the national
        # archives), daily ERC caches, and the store cubes the builder reads.
        run: |
          gh release download data-pack --pattern cofire-datapack.tar.gz --dir "$RUNNER_TEMP"
          uv run python -m cofire.ship.datapack restore "$RUNNER_TEMP/cofire-datapack.tar.gz"
      - name: Refresh
        run: uv run python -m cofire.ship.runner refresh -- uv run python -m cofire.ship.refresh
      - name: Per-run download ceiling
        if: always()
        run: uv run python -m cofire.ship.ci_budget check
      - name: Checks
        run: uv run pytest -q tests/test_frozen_model.py tests/test_delayed_feedback_gate.py tests/test_historical_range.py tests/test_rendering.py tests/test_refresh.py tests/test_bundles.py tests/test_vintages.py tests/test_usdm_calendar.py tests/test_forward.py
      - name: Save the data pack
        run: |
          uv run python -m cofire.ship.datapack pack "$RUNNER_TEMP/cofire-datapack.tar.gz"
          gh release upload data-pack "$RUNNER_TEMP/cofire-datapack.tar.gz" --clobber
      - name: Commit the refreshed export
        run: |
          git config user.name "cofire-refresh"
          git config user.email "cofire-refresh@users.noreply.github.com"
          git add artifacts/ship/forecast_issues.parquet artifacts/ship/refresh_log.json artifacts/ship/issue_vintages.json artifacts/vintages artifacts/ci/ledger.json artifacts/ship/usdm_national_sizes.json artifacts/forecasts app/lib/forward.json app/lib/brief_latest.json demo app/lib/story.json
          if git diff --cached --quiet; then
            echo "nothing new this week"
          else
            git commit -m "Weekly refresh $(date -u +%F)"
            # A push to main during the run (it takes about ten minutes) would
            # reject this one; the bot touches only generated files, so rebase.
            git pull --rebase origin main
            git push
          fi
      - name: Keep the ledger of a failed run
        # The commit step above runs only on success, so a failed run's
        # transfers used to vanish from the committed ledger (runs
        # 37072550722, 37237706715 and 37237839170; corrected by hand).
        if: failure() && !inputs.force_fail
        run: |
          git config user.name "cofire-refresh"
          git config user.email "cofire-refresh@users.noreply.github.com"
          git reset -q
          git add artifacts/ci/ledger.json artifacts/ship/usdm_national_sizes.json
          if ! git diff --cached --quiet; then
            git commit -m "Ledger of failed refresh run ${{ github.run_id }}"
            git pull --rebase origin main
            git push
          fi

  # A failed run opens an issue (or comments on the open one), which notifies
  # the repository's owner and watchers whoever owns it. GitHub's own failure
  # email for a scheduled workflow goes to whoever last edited the cron line,
  # which is not reliably the owner, least of all after a transfer.
  alert:
    needs: [refresh]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Weekly refresh failed"
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The **$GITHUB_WORKFLOW** run failed on $(date -u +%F) (trigger: $GITHUB_EVENT_NAME, commit ${GITHUB_SHA::7}).

          Run log: $run_url

          Close this issue once a run succeeds."
          gh label create workflow-failure --color B60205 --description "A scheduled workflow failed" 2>/dev/null || true
          open=$(gh issue list --label workflow-failure --state open --json number,title -q ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --label workflow-failure --body "$body"
          fi
