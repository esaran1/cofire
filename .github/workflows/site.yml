name: site

# Builds the static site from the committed export on every change, and
# deploys it to GitHub Pages once Pages is enabled for the repository (set the
# repository variable PAGES_ENABLED to "true"). A push made by the refresh's
# token does not trigger workflows, so the refresh is listened for directly.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["weekly refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync
      - run: npm install
        working-directory: app
      - run: BASE_PATH=/${{ github.event.repository.name }} ./scripts/build_static.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
