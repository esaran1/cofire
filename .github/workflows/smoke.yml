name: daily smoke

# Every day, every route in both languages is loaded and checked
# (app/e2e/static/smoke.spec.ts): against the deployed site once GitHub Pages
# is enabled (repository variable PAGES_ENABLED = "true"), and against the
# production static build served locally until then. A failure opens an issue,
# or comments on the open one.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Fail on purpose, to test the failure alert"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forced failure (alert test)
        if: inputs.force_fail
        run: |
          echo "force_fail was set: failing on purpose to test the alert"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: app
      - name: Target the deployed site
        if: vars.PAGES_ENABLED == 'true'
        run: |
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          echo "STATIC_URL=https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v4
        if: vars.PAGES_ENABLED != 'true'
      - uses: actions/setup-python@v5
        if: vars.PAGES_ENABLED != 'true'
        with:
          python-version: "3.11"
      - name: Build and serve the static site locally (Pages not enabled yet)
        if: vars.PAGES_ENABLED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv sync
          mkdir -p app/public/tiles
          gh release download basemap --pattern colorado.pmtiles --dir app/public/tiles
          echo "b661b095ddda73c62b705e478a31deea66c7f3b745e2411e9361c79b7bb50fba  app/public/tiles/colorado.pmtiles" | sha256sum -c -
          BASE_PATH=/cofire ./scripts/build_static.sh
          python3 scripts/serve_static.py --port 4100 --root app/out --base /cofire &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4100/cofire/ >/dev/null && break; sleep 0.2; done
          echo "STATIC_URL=http://127.0.0.1:4100/cofire/" >> "$GITHUB_ENV"
      - name: Smoke checks
        working-directory: app
        run: npx playwright test -c playwright.static.config.ts e2e/static/smoke.spec.ts

  alert:
    needs: [smoke]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Daily smoke check failed"
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The **$GITHUB_WORKFLOW** run failed on $(date -u +%F) (trigger: $GITHUB_EVENT_NAME, commit ${GITHUB_SHA::7}).

          Run log: $run_url

          Close this issue once a run succeeds."
          gh label create workflow-failure --color B60205 --description "A scheduled workflow failed" 2>/dev/null || true
          open=$(gh issue list --label workflow-failure --state open --json number,title -q ".[] | select(.title == env.TITLE) | .number" | head -1)
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --label workflow-failure --body "$body"
          fi
