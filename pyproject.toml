[project]
name = "cofire"
version = "0.1.0"
description = "Colorado Fire Intelligence and Risk Engine — drought and fire-spread condition forecasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "xarray>=2024.1",
  "rioxarray>=0.15",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "requests>=2.31",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.111",
  "sqlmodel>=0.0.18",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "rio-tiler>=6.4",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "slowapi>=0.1.9",
  "torch>=2.2",
  "shap>=0.45",
  "pillow>=10.3",
  "aiohttp>=3.14.3",
  "h5py>=3.16.0",
  "arch>=8.0.0",
  "statsmodels>=0.15.0",
  "climate-indices>=2.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "types-requests>=2.31",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cofire*"]

[tool.setuptools.package-data]
"cofire.model" = ["ember_checklist.yaml", "py.typed"]
"cofire.model.explain" = ["feature_groups.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["cofire", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
packages = ["cofire.model"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "lightgbm.*",
  "statsmodels.*",
  "arch.*",
  "climate_indices.*",
  "geopandas.*",
  "rioxarray.*",
  "rio_tiler.*",
  "rasterio.*",
  "shapely.*",
  "pyproj.*",
  "sklearn.*",
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "yaml",
  "PIL",
  "PIL.*",
  "matplotlib.*",
  "matplotlib.pyplot",
  "netCDF4.*",
  "torch.*",
  "shap.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored third-party code, kept byte-identical to upstream so the shipping
# path runs the authors' implementation rather than a reimplementation.
module = ["cofire.model.uncertainty.reference_pid"]
follow_imports = "skip"
ignore_errors = true
disallow_untyped_calls = false


[tool.ruff.lint.per-file-ignores]
# Vendored third-party code, kept byte-identical to upstream.
"cofire/model/uncertainty/reference_pid.py" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
